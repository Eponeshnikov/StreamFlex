[project]
name = "streamflex"
version = "0.1.0"
description = "A flexible application framework with plugin support, state snapshots, and dynamic widget management. Built with Streamlit for rapid UI development."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.44",
    "importlib>=1.0.4",
    "kaleido>=1.2.0",
    "loguru>=0.7.3",
    "optuna>=4.9.0",
    "orjson>=3.11.0",
    "psutil>=7.0.0",
    "streamlit>=1.44",
    "tomli>=2.2.1",
]

[dependency-groups]
cir-generator = [
    "plotly>=6.0.1",
    "sionna>=2.0.1",

]
codegenerator = [
    "galois>=0.4.4",
    "pandas>=2.2.3",
    "sdr>=0.0.27",
]
dev = [
    "catboost>=1.2.8",
    "cupy-cuda13x>=13.0",
    "dask>=2025.4.1",
    "dask-ml>=2025.1.0",
    "deltalake>=0.25.5",
    "fastexcel>=0.14.0",
    "folium>=0.20.0",
    "infomeasure>=0.5.1",
    "ipywidgets>=8.1.5",
    "itables>=2.4.4",
    "jupyter>=1.1.1",
    "mapbox-earcut>=2.0.0",
    "narwhals<1.48",
    "openpyxl>=3.1.5",
    "pandarallel>=1.6.5",
    "polars-complex",
    "prettytable>=3.16.0",
    "pyqt6>=6.9.1",
    "pyside6>=6.9.1",
    "pysocks>=1.7.1",
    "pytest>=9.1.1",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "shap>=0.48.0",
    "streamlit-folium>=0.27.4",
    "sympy>=1.14.0",
    "tqdm>=4.67.1",
    "xgboost==3.0.0",
    "xlsxwriter>=3.2.5",
]
iqgenerator = [
    "galois>=0.4.4",
    "plotly>=6.0.1",
    "sionna>=2.0.1",

]
opti-receiver = [
    "plotly>=6.0.1",
    "pywavelets>=1.8.0",
    "sionna>=2.0.1",

    "torch>=2.10.0",
    "torchvision>=0.25.0",
]
pulse-shaping = [
    "plotly>=6.0.1",
    "sionna>=2.0.1",

]
results-saver-plugin = [
    "pandas>=2.2.3",
    "polars>=1.29.0",
    "tables>=3.10.2",
]
resultssaverplugin = [
    "pandas>=2.2.3",
    "polars>=1.30.0",
    "pyarrow>=20.0.0",
    "tables>=3.10.2",
]
signal-channelizer = [
    "plotly>=6.0.1",
    "sionna>=2.0.1",

]

[tool.uv.sources]
polars-complex = { git = "https://github.com/monochromatti/polars-complex.git" }

torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# pages/ and plugins/* are separate git repos without their own pyproject.toml,
# so ruff walks up to this file and one config covers the whole tree.
line-length = 79
target-version = "py312"
extend-exclude = [
    ".cache",
    ".tmp",
    "logs",
    "output_data",
    "sionna-scenes",
    "snapshots",
    "tmp",
    # Ruff reformats Python snippets inside fenced blocks; the plugin READMEs
    # quote payloads verbatim and should stay as written.
    "*.md",
]

[tool.ruff.lint]
ignore = [
    # Loguru uses `{}`-style lazy formatting, not stdlib `%s`; the stdlib
    # logging rules misread every `logger.info("... {}", value)` call.
    "PLE1205",
    "G201",
    "TRY400",
    # Streamlit pages and plugins deliberately swallow per-item failures so one
    # bad config/row cannot take down the whole run; the handlers log and
    # continue on purpose.
    "BLE001",
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
# Vendored NIST STS reference implementation (see LICENSE.upstream): keep it
# byte-comparable with upstream instead of restyling it.
"pages/key_generation/compute/nist/[A-Z]*.py" = ["ALL"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
